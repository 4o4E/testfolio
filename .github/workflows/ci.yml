name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run spec:validate

  image-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, web, openspec]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-check.yml
    with:
      export-cache: true

  image-smoke-pr:
    if: github.event_name == 'pull_request'
    needs: [python, web, openspec]
    permissions:
      contents: read
    uses: ./.github/workflows/image-check.yml

  validate-release-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [python, web, openspec]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate semantic version and main ancestry
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$ ]]; then
            echo "Invalid supported semantic version tag: $tag" >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

  publish-image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: validate-release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/4o4e/testfolio
          flavor: latest=auto
          tags: |
            type=raw,value={{tag}}
            type=semver,pattern={{version}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/4o4E/testfolio
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=ghcr.io/4o4e/testfolio:buildcache-ci
            type=registry,ref=ghcr.io/4o4e/testfolio:buildcache-release
          cache-to: type=registry,ref=ghcr.io/4o4e/testfolio:buildcache-release,mode=max
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify published image over HTTP
        run: python scripts/ci_smoke.py ghcr.io/4o4e/testfolio@${{ steps.build.outputs.digest }}

  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
